<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo Flask - Camp Code</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div class="container mt-5">
<!--==============================================================================-->
<!--===========Formulário Get==================-->
        <div class="row mt-4">
            <h3>Formulário GET</h3>
            <div class="col">
                <h3>Contato</h3>
            </div>
        </div>

        <form action="" method="get" class="row">
            

            <div class="col-9">
                <label class="form-label">
                    Digite algo para 
                </label>

                <input type="text"
                       name="pesquisa"
                       class="form-control">
            </div>

            <div class="col-3 d-flex align-items-end">
                <button type="submit"
                        class="btn btn-primary w-100">
                    Pesquisar
                </button>
            </div>

        </form>

        <p>Voce pesquisou: {{context['pesquisa']}} </p>

        <hr>
        <hr>
<!--=================================================================-->
<!--=======================Formulário Post===============================-->
        <div class="row">
            <h3>Formulário post</h3>
        </div>

        <form action="" method="post" class="row mt-4">

<!--==================================================================================-->
<!--========================CAMPO USUÁRIO=============================================-->
            <div class="col-6">
                Nome:
            <input type="text"
                       name="nome"
                       id=""
                       class="form-control"
                       required>
            </div>

            <div class="col-6">
                E-mail:
                <input type="text"
                        name="email"
                        id=""
                        class="form-control"
                        required>
            </div>

            <div class="col-12">
                Assunto:
                <input type="text"
                       name="assunto"
                       id=""
                       class="form-control"
                       required>
            </div>

            <div class="col-12">
                Mensagem:
                <input type="text"
                        name="mensagem"
                        id=""
                        class="form-control"
                        required>

            </div>

            <div class="col-3 d-flex align-items-end">
                <button type="submit"
                        class="btn btn-dark w-100">
                    Pesquisar
                </button>
            </div>

            
        </form>
    </div>
<!--=======================================Java Script===================================-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
