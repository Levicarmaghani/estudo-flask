{% extends 'base.html' %}
{% block content %}

    <div class="container mt-5">
<!--==============================================================================-->
<!--===========Formulário Post==================-->
        <div class="row">
            <h3 class="texto">Lista de Contato</h3>

            <form method="get" class="row">
                <div class="col-9">
                    <input type="text" name="pesquisa" class="form-control" >
                </div>

                <div class="col-3">
                    <button class="btn btn-primary">Pesquisar</button>
                </div>
            </form>
            
        </div>

        <!--==============Lista Contatos===============================-->
        <div>
            <table class="table table-hover  table table-bordered">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-Mail</th>
                        <th>Assunto</th>
                        <th>Respondido</th>
                    </tr>
                </thead>
                <tbody>
                    {% for linha in context['dados'] %}
                    <tr>
                        <td>{{linha.nome}}</td>
                        <td>{{linha.email}}</td>
                        <td>{{linha.assunto}}</td>
                        <td>
                            {% if linha.respondido == 1 %}
                                Sim
                            {% else %}
                                Não
                            {% endif %}
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

        </div>


    </div>
{% endblock %}
