{% extends 'base.html' %}
{% block content %}

<div class="d-flex justify-content-end gap-2">
    <a href="{{ url_for('main.contato') }}" class="btn btn-primary">Home</a>

    <a href="{{ url_for('main.logout') }}"
     class="btn btn-primary"
     onclick="return confirm('Tem certeza que deseja sair?')">
     Sair
    </a>
</div>

    <div class="container mt-5">
<!--==============================================================================-->
<!--===========Formulário Post==================-->
        <div class="row">
            <h3 class="texto">Lista de Contato</h3>

            <form method="get" class="row">
                <div class="col-9">
                    <input type="text" name="pesquisa" class="form-control" >
                </div>

                <div class="col-3">
                    <button class="btn btn-primary">Pesquisar</button>
                </div>
            </form>
            
        </div>

        <!--==============Lista Contatos===============================-->
        <div>
            <table class="table table-hover  table table-bordered">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-Mail</th>
                        <th>Assunto</th>
                        <th>Mensagem</th>
                    </tr>
                </thead>
                <tbody>
                    {% for linha in context %}
                    <tr>
                        <td>{{linha.nome}}</td>
                        <td>{{linha.email}}</td>
                        <td>{{linha.assunto}}</td>
                        <td>
                            <a href="{{ url_for('main.ver_mensagem', id=linha.id) }}"
                                class="btn btn-primary btn-sm">
                                Ver mensagem
                            </a>
                        </td>
                            
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

        </div>

 


    </div>
{% endblock %}
